services:
  postgres:
    image: postgres:16-alpine
    container_name: databridge-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: postgres_lab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres_lab"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - databridge-network

  redis:
    image: redis:7-alpine
    container_name: databridge-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - databridge-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: databridge-app
    restart: always
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/postgres_lab
      - REDIS_URL=redis://redis:6379/0
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - databridge-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  databridge-network:
    driver: bridge
